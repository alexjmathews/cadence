name: Cadence
options:
  bundleIdPrefix: com.alexmathews.cadence
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with the personal "Alex Mathews" team via automatic signing.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W3843BN32E
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - Cadence
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Cadence/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmathews.cadence
        CODE_SIGN_ENTITLEMENTS: Cadence/Cadence.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: CadenceWidget
        embed: true

  CadenceWidget:
    type: app-extension
    platform: macOS
    sources:
      - CadenceWidget
      - Shared
    settings:
      base:
        INFOPLIST_FILE: CadenceWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmathews.cadence.widget
        CODE_SIGN_ENTITLEMENTS: CadenceWidget/CadenceWidget.entitlements
