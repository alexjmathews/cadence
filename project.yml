name: Cadence
options:
  bundleIdPrefix: com.alexmathews.cadence
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with the personal "Alex Mathews" team via automatic signing.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W3843BN32E
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - Cadence
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Cadence/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmathews.cadence
        CODE_SIGN_ENTITLEMENTS: Cadence/Cadence.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: CadenceWidget
        embed: true

  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CadenceTests
      # The widget's views, compiled into the test bundle as well as into the
      # extension. `WidgetGeometryTests` renders them at the real family sizes and
      # measures where the ink lands, which is the only way to catch a layout fault
      # — the complete card's transport once overran its column and pulled the whole
      # tile 16 pt off the leading edge, and every presentation test still passed.
      - CadenceWidget/CadenceWidgetViews.swift
      - CadenceWidget/CadenceIntents.swift
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmathews.cadence.tests
        # The widget's view files find `DesignTokens` and the rest of `Shared/` in
        # their own module when they compile into the extension, and in the host app's
        # when they compile in here. This is the only difference between the two, and
        # it is one conditional import at the top of each file.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CADENCE_TESTS"
        # Hosted in the app so the suite runs inside a process that actually holds
        # the App Group entitlement — the round-trips go through the real
        # container, not a lookalike suite in ~/Library/Preferences.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cadence.app/Contents/MacOS/Cadence"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CadenceWidget:
    type: app-extension
    platform: macOS
    sources:
      - CadenceWidget
      - Shared
    settings:
      base:
        INFOPLIST_FILE: CadenceWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmathews.cadence.widget
        CODE_SIGN_ENTITLEMENTS: CadenceWidget/CadenceWidget.entitlements

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CadenceTests

  CadenceTests:
    build:
      targets:
        CadenceTests: [test]
    test:
      config: Debug
      targets:
        - CadenceTests
